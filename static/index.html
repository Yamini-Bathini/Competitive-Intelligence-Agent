<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Foresight</title>
<style>:root{--bg:#0d1a1e;--card:#14262b;--in:#0f2126;--line:#24404a;--ink:#e2eeee;--mut:#8fa8ad;--acc:#f0b429;--ok:#4cc29a;--hot:#ff7a5c;--blue:#4a90c9;--vio:#b18cff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,Segoe UI,sans-serif}
header{padding:20px 32px 6px;display:flex;flex-wrap:wrap;gap:10px 20px;justify-content:space-between;align-items:center}h1{margin:0;font-size:30px;letter-spacing:-.03em;font-weight:800}small,.mut{color:var(--mut)}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:none;color:var(--ink);padding:6px 14px;border-radius:6px}button:hover{border-color:var(--mut)}button.p{background:var(--acc);border-color:var(--acc);color:#1a1300;font-weight:700}button:disabled{opacity:.4}
.pill{display:inline-flex;gap:8px;align-items:center;padding:4px 14px;border-radius:99px;font-weight:700;font-size:13px}.pill i{width:9px;height:9px;border-radius:50%;background:currentColor}
main{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;padding:8px 32px 32px}@media(max-width:900px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px}.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}@media(max-width:700px){.tiles{grid-template-columns:1fr 1fr}}
.tiles .card{margin:0}.k{font-size:11px;letter-spacing:.1em;color:var(--mut)}.n{font-size:34px;font-weight:800;line-height:1.2}
nav{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}nav button{border:0;border-radius:6px 6px 0 0;font-weight:600;color:var(--mut)}nav button.on{color:var(--ink);box-shadow:inset 0 -2px var(--acc)}
.sig{background:var(--in);border-left:4px solid var(--c);border-radius:8px;padding:10px 14px;margin-bottom:10px}.tag{font-size:11px;font-weight:700;padding:1px 10px;border-radius:99px;background:color-mix(in srgb,var(--c) 20%,transparent);color:var(--c);margin-right:8px}
.pat{border-left:4px solid var(--acc);padding:2px 12px;margin:10px 0}.badge{font-size:11px;font-weight:700;padding:1px 10px;border-radius:99px;margin-right:8px}
.ask,.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}input,select{font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:6px;background:var(--in);color:var(--ink);min-width:0}input{flex:1}
.log{font-size:12.5px;max-height:460px;overflow:auto}.log div{padding:5px 0;border-top:1px solid var(--line)}.err{background:#3a1d16;border:1px solid var(--hot);color:#ffd2c6;border-radius:8px;padding:10px 14px;margin:0 32px 8px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:700px){.two{grid-template-columns:1fr}}</style></head><body>
<header><div><h1>Foresight</h1><small>Competitor intelligence that remembers</small></div>
<div><span class="pill" id="pill"></span> <button class="p" id="nx">Ingest next month</button> <button id="al">Ingest all</button> <button id="rs">Reset</button></div></header>
<div id="err"></div>
<main><section><div class="tiles" id="tiles"></div><nav id="tabs"></nav><div id="v"></div></section>
<aside><div class="card"><b>Memory activity</b> <small id="bank"></small><div class="log" id="log"></div></div></aside></main>
<script>
const $=id=>document.getElementById(id),e=s=>String(s??"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const api=async(p,o)=>{const r=await fetch("/api/"+p,o);const j=await r.json();if(!r.ok)throw new Error(j.detail||"Request failed");return j},post=(p,b)=>api(p,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b||{})});
const COL={pricing:"#ff7a5c",launch:"#f0b429",hiring:"#4a90c9",messaging:"#b18cff",blog:"#8fa8ad"};
let tab="dashboard",ans="";const T=["dashboard","ask","timeline","brief","predictions","add / watch"];
const sig=x=>`<div class="sig" style="--c:${COL[x.type]}"><span class="tag">${x.type}</span><b>${e(x.comp)}</b> ${e(x.raw)}<span class="mut" style="float:right;font-size:12px">${x.date.slice(5)}${x.imp?" · importance "+x.imp:""}</span>${x.insight?`<div class="mut" style="font-size:12.5px;margin-top:4px">Insight: ${e(x.insight)}</div>`:""}</div>`;
const pat=p=>`<div class="pat"><b>${e(p.comp)}:</b> ${e(p.text)}${p.conf?` <span class="badge" style="background:#123328;color:var(--ok)">${e(p.conf)}</span>`:""}<br><span class="mut">${e(p.act||"")}</span></div>`;
const pr=p=>`<div style="margin:10px 0"><span class="badge" style="background:${p.status=="hit"?"#123328":p.status=="miss"?"#3a1d16":"#33290b"};color:${p.status=="hit"?"var(--ok)":p.status=="miss"?"var(--hot)":"var(--acc)"}">${p.status.toUpperCase()}</span>${e(p.claim)}<div class="mut" style="font-size:12.5px">made ${p.made}${p.resolved?" · resolved "+p.resolved:""}</div></div>`;
async function side(){const s=await api("state"),L=await api("predictions"),P=await api("timeline"),ok=s.backend=="hindsight"||s.backend=="foresight db";
$("pill").innerHTML=`<i></i>memory: ${s.backend}`;$("pill").style.cssText=`background:${ok?"#123328":"#33290b"};color:${ok?"var(--ok)":"var(--acc)"}`;$("nx").disabled=s.month>=6;
$("err").innerHTML=!ok&&s.error?`<div class="err"><b>Not connected to Hindsight.</b> ${e(s.error)}<br>Put HINDSIGHT_URL and HINDSIGHT_API_KEY in a .env file and restart. The app keeps working on local fallback memory.</div>`:"";
$("tiles").innerHTML=[["MEMORIES",s.events,""],["PATTERNS",P.patterns.length,""],["PREDICTION HIT RATE",L.hit_rate==null?"n/a":L.hit_rate+"%","color:var(--ok)"],["OPEN HYPOTHESES",L.open,"color:var(--acc)"]].map(t=>`<div class="card"><div class="k">${t[0]}</div><div class="n" style="${t[2]}">${t[1]}</div></div>`).join("");
$("bank").textContent=s.bank;$("log").innerHTML=s.ops.map(o=>`<div><b style="color:${o.op=="retain"?"var(--ok)":o.op=="error"?"var(--hot)":"var(--mut)"}">${o.op}</b> ${e(o.text)}</div>`).join("")||'<span class="mut">No activity yet</span>'}
async function view(){$("tabs").innerHTML=T.map(t=>`<button class="${t==tab?"on":""}" onclick="tab='${t}';view()">${t}</button>`).join("");const v=$("v");
try{
if(tab=="dashboard"){const [s,p,l]=await Promise.all([api("signals?limit=8"),api("timeline"),api("predictions")]);
v.innerHTML=`<div class="card"><b>Live signals</b> <small>newest first</small><div style="margin-top:10px">${s.map(sig).join("")||'<div class="mut">Nothing yet. Click Ingest next month, or use add / watch.</div>'}</div></div><div class="two"><div class="card"><b>Patterns</b>${p.patterns.map(pat).join("")||'<div class="mut" style="margin-top:8px">None yet. Patterns need repeated behavior.</div>'}</div><div class="card"><b>Prediction ledger</b>${l.predictions.slice(0,4).map(pr).join("")||'<div class="mut" style="margin-top:8px">No predictions yet.</div>'}</div></div>`}
if(tab=="ask"){v.innerHTML=`<div class="ask"><input id="q" placeholder="Ask about a competitor, or say: ignore blog posts"><button class="p" id="go">Ask</button></div><div>${["What has NimbusCRM done on pricing?","Is Kestrel copying anyone?","What changed recently?","Ignore blog posts"].map(s=>`<button style="margin:0 6px 8px 0" onclick="$('q').value='${s}';$('go').click()">${s}</button>`).join("")}</div><div id="a">${ans}</div>`;
$("go").onclick=async()=>{const r=await post("ask",{q:$("q").value});ans=`<div class="card"><p>${e(r.answer)}</p>${r.events.map(sig).join("")}${r.patterns.map(pat).join("")}${r.evidence.length?`<div class="mut" style="margin-top:10px"><b>Recalled memories</b>${r.evidence.map(m=>`<div style="font-size:12.5px;padding-top:4px">• ${e(m)}</div>`).join("")}</div>`:""}</div>`;$("a").innerHTML=ans;side()};$("q").onkeydown=k=>k.key=="Enter"&&$("go").click()}
if(tab=="timeline"){const r=await api("timeline");v.innerHTML=r.patterns.map(pat).join("")+`<div class="cols">${r.competitors.map(c=>`<div class="card"><b>${e(c)}</b><div style="margin-top:8px">${r.events.filter(x=>x.comp==c).map(sig).join("")}</div></div>`).join("")}</div>`||'<div class="card">No data yet.</div>'}
if(tab=="brief"){const r=await api("brief");v.innerHTML=r.empty?'<div class="card">Ingest a month first.</div>':`${r.muted.length?`<div class="card mut">Personalized from memory: no ${r.muted.join(", ")}</div>`:""}${r.narrative?`<div class="card">${e(r.narrative)}</div>`:""}<div class="card"><b>What changed (to ${r.until})</b><div style="margin-top:10px">${r.recent.map(x=>sig(x)+`<div class="mut" style="font-size:12.5px;margin:-4px 0 10px 14px">So what: ${e(x.sowhat)}</div>`).join("")}</div></div><div class="card"><b>Patterns</b>${r.patterns.map(pat).join("")||'<div class="mut">None yet</div>'}</div>`}
if(tab=="predictions"){const r=await api("predictions");v.innerHTML=`<div class="card"><b>Hit rate: ${r.hit_rate==null?"n/a":r.hit_rate+"%"}</b> <span class="mut">(${r.resolved} resolved, ${r.open} open)</span></div><div class="card">${r.predictions.map(pr).join("")||'<span class="mut">No predictions yet</span>'}</div>`}
if(tab=="add / watch"){const w=await api("watch"),s=await api("state");v.innerHTML=`<div class="card"><b>Add a signal</b><div class="row" style="margin-top:10px"><input id="c" list="cl" placeholder="Competitor"><datalist id="cl">${s.competitors.map(c=>`<option value="${e(c)}">`).join("")}</datalist><select id="t">${["pricing","hiring","launch","messaging","blog"].map(x=>`<option>${x}</option>`).join("")}</select><input id="d" type="date" style="flex:0 0 160px" value="${new Date().toISOString().slice(0,10)}"></div><div class="row"><input id="x" placeholder="Starts with a verb, e.g. cut Pro from $35 to $29/seat"><button class="p" id="sv">Add</button></div><div id="m1" class="mut"></div></div>
<div class="card"><b>Watch a page</b> <small>checked automatically every ${"hour"}; changes become memories</small><div class="row" style="margin-top:10px"><input id="wc" placeholder="Competitor"><input id="wu" placeholder="https://competitor.com/pricing"><select id="ws">${["pricing","launch","hiring","messaging","blog"].map(x=>`<option>${x}</option>`).join("")}</select><button class="p" id="wb">Watch</button></div><div id="m2" class="mut"></div>${w.map(x=>`<div class="mut" style="font-size:12.5px">• ${e(x.comp)} · ${e(x.url)} · last checked ${e(x.last)}</div>`).join("")}<button style="margin-top:10px" id="ca">Check all now</button> <button style="margin-top:10px" id="ta">Send test alert</button></div>`;
$("sv").onclick=async()=>{try{await post("signal",{date:$("d").value,competitor:$("c").value,type:$("t").value,text:$("x").value});$("m1").textContent="Added and retained to memory.";$("x").value="";side()}catch(z){$("m1").textContent=z.message}};
$("wb").onclick=async()=>{$("m2").textContent="Fetching…";try{const r=await post("collect",{competitor:$("wc").value,url:$("wu").value,signal:$("ws").value});$("m2").textContent=r.status+(r.facts.length?": "+r.facts.join("; "):"");side()}catch(z){$("m2").textContent=z.message}};
$("ca").onclick=async()=>{$("m2").textContent="Checking…";const r=await post("check-all");$("m2").textContent=r.map(x=>x.comp+": "+x.status).join(" | ")||"Nothing watched yet";side()};$("ta").onclick=async()=>{try{const r=await post("test-alert");$("m2").textContent=r.webhook_configured?"Test alert sent to your webhook.":"Set ALERT_WEBHOOK in .env first."}catch(z){$("m2").textContent=z.message}}}
}catch(z){v.innerHTML=`<div class="err" style="margin:0">${e(z.message)}</div>`}}
$("nx").onclick=async()=>{await post("replay");view();side()};$("al").onclick=async()=>{await post("replay?all=true");view();side()};$("rs").onclick=async()=>{await post("reset");ans="";view();side()};
view();side();
</script></body></html>
